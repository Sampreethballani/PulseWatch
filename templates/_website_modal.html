<div class="modal fade" id="websiteModal" tabindex="-1" aria-labelledby="websiteModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" method="post" id="websiteForm" action="{{ url_for('add_website') }}">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="websiteModalTitle">Add a website</h2>
          <p class="modal-subtitle" id="websiteModalSubtitle">Only public HTTP and HTTPS addresses can be monitored.</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <div class="mb-3">
          <label class="form-label" for="websiteName">Display name</label>
          <input class="form-control" id="websiteName" name="name" maxlength="80" placeholder="e.g. Production API" autocomplete="off">
          <div class="form-text">Optional — the host name is used when left blank.</div>
        </div>
        <div class="mb-1">
          <label class="form-label" for="websiteUrl">URL</label>
          <input class="form-control" id="websiteUrl" name="url" required placeholder="https://www.example.com" autocomplete="off" spellcheck="false">
          <div class="form-text">Scheme defaults to HTTPS. Ports 80 and 443 only.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="websiteSubmit">
          <i class="fa-solid fa-plus"></i><span>Add website</span>
        </button>
      </div>
    </form>
  </div>
</div>
