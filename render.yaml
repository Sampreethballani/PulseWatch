# Render Blueprint — PulseWatch (free web service)
#
# This configuration runs on Render's free instance type: no payment method, no
# persistent disk. The SQLite file therefore lives on the instance's ephemeral
# filesystem and its history is lost whenever Render restarts, redeploys, or
# spins the service down after inactivity. Monitoring also pauses while the
# free instance is asleep. For durable history, switch `plan` to `starter`,
# mount a disk at /var/data, set DATABASE_PATH=/var/data/monitor.db and
# PULSEWATCH_REQUIRE_PERSISTENT_DB=1.
services:
  - type: web
    name: pulsewatch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Relative paths resolve from the application directory (repository root).
      # This is writable on Render's free instances, but it is NOT persistent.
      - key: DATABASE_PATH
        value: data/monitor.db
      - key: SECRET_KEY
        generateValue: true   # Render generates and stores a strong value
      - key: ADMIN_TOKEN
        sync: false           # you supply this in the Render dashboard
      - key: WEB_CONCURRENCY
        value: "1"            # the in-process scheduler needs exactly one worker
